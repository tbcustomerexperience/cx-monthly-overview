<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overview CX · Tania Bulhões</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--green:#173326;--green2:#24483a;--ivory:#f7f4ee;--paper:#fffdf9;--gold:#aa8d5c;--text:#242724;--muted:#7b7b74;--line:rgba(23,51,38,.14)}
*{box-sizing:border-box;margin:0;padding:0} html{scroll-behavior:smooth} body{font-family:'DM Sans',sans-serif;background:var(--ivory);color:var(--text);min-height:100vh}
.rail{position:fixed;top:0;left:0;right:0;height:72px;background:rgba(247,244,238,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);z-index:30;display:flex;align-items:center;padding:0 5vw}
.rail-brand{display:flex;align-items:center;gap:13px}.rail-brand .mark{width:22px;height:22px;border:1px solid var(--green);border-radius:50%;position:relative}.rail-brand .mark:after{content:'';position:absolute;inset:7px;border-radius:50%;background:var(--green)}
.rail-brand span:last-child{font-family:'Cormorant Garamond',serif;font-size:17px;color:var(--green);letter-spacing:.03em}.rail-nav{margin-left:auto;display:flex;gap:34px}.rail-link{color:var(--muted);text-decoration:none;font-size:11px;letter-spacing:.14em;text-transform:uppercase}.rail-link svg{display:none}.rail-link.active,.rail-link:hover{color:var(--green)}.rail-foot{display:none}
.page{padding-top:72px}.cover{max-width:1280px;margin:auto;min-height:690px;padding:9vh 6vw 7vh;display:flex;flex-direction:column;justify-content:center;position:relative}.cover:before{content:'';position:absolute;left:6vw;right:6vw;top:7vh;border-top:1px solid var(--line)}
.cover .eyebrow{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:26px}.cover h1{font-family:'Cormorant Garamond',serif;font-size:clamp(64px,8vw,112px);font-weight:400;line-height:.9;letter-spacing:-.045em;color:var(--green);max-width:900px}.cover h1:after{content:''}.cover .sub{font-size:13px;color:var(--muted);line-height:1.8;max-width:460px;margin:26px 0 70px}
.current-label{display:block;font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}.cover-current{width:100%;display:grid;grid-template-columns:110px 1fr auto;align-items:center;gap:30px;border-top:1px solid var(--green);border-bottom:1px solid var(--line);padding:26px 0;background:transparent;min-height:0;color:var(--text)}
.cover-current:before,.cover-current:after{display:none}.cover-current .date-badge{position:static;display:block;width:auto;height:auto;background:transparent}.cover-current .date-badge .num{display:block;font-family:'Cormorant Garamond',serif;font-size:48px;font-weight:400;color:var(--green);line-height:.8}.cover-current .date-badge .yr{display:block;font-size:9px;letter-spacing:.2em;color:var(--gold);margin-top:10px}.cover-current .label{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}.cover-current .month{font-family:'Cormorant Garamond',serif;font-size:31px;font-weight:500;color:var(--green)}
.cover-current a{margin:0;display:inline-flex;align-items:center;gap:28px;text-decoration:none;color:var(--green);font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);padding:15px 19px;transition:.25s}.cover-current a:hover{background:var(--green);color:var(--ivory);border-color:var(--green)}
.content-inner{background:var(--paper);border-top:1px solid var(--line);padding:90px 6vw 110px}.history{max-width:1120px;margin:auto}.history-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:44px}.history-head h2{font-family:'Cormorant Garamond',serif;font-size:46px;font-weight:400;color:var(--green);letter-spacing:-.025em}.history-head .count{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.year-group{margin-top:35px}.year-label{font-size:10px;letter-spacing:.25em;color:var(--gold);margin-bottom:14px}.history-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line)}.history-card{background:transparent;border:0;border-bottom:1px solid var(--line);padding:24px 4px;min-height:90px;display:flex;align-items:center;justify-content:space-between;text-decoration:none;color:var(--green);transition:.2s}.history-card:hover{padding-left:12px}.history-card .month-name{font-family:'Cormorant Garamond',serif;font-size:25px;font-weight:400}.history-card .arrow{font-size:18px;color:var(--gold)}.history-empty{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:28px 0;color:#999;font-size:12px;font-style:normal;text-align:left}
footer{background:var(--paper);border-top:0;margin:0;padding:0 6vw 45px;text-align:center;color:#96948d;font-size:9px;letter-spacing:.16em;text-transform:uppercase}
@media(max-width:700px){.rail{height:62px;padding:0 22px}.rail-nav{gap:18px}.rail-brand span:last-child{display:none}.page{padding-top:62px}.cover{padding:70px 24px 60px;min-height:auto}.cover:before{left:24px;right:24px;top:38px}.cover h1{font-size:58px}.cover .sub{margin-bottom:48px}.cover-current{grid-template-columns:70px 1fr;gap:18px}.cover-current a{grid-column:1/-1;justify-content:space-between}.cover-current .date-badge .num{font-size:38px}.content-inner{padding:64px 24px 80px}.history-head h2{font-size:36px}.history-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

  <!-- ===== MENU LATERAL DISCRETO ===== -->
  <nav class="rail" aria-label="Menu">
    <div class="rail-brand">
      <span class="mark"></span>
      <span>Tania Bulhões</span>
    </div>
    <div class="rail-nav">
      <a class="rail-link active" href="#top">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
        <span class="label">Overview CX</span>
      </a>
      <a class="rail-link" href="#historico">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></svg>
        <span class="label">Histórico</span>
      </a>
    </div>
    <div class="rail-foot">
      <span class="avatar">CX</span>
      <span>Customer Experience</span>
    </div>
  </nav>

  <div class="page">

    <!-- CAPA -->
    <section class="cover" id="top">
      <h1>Customer Experience</h1>
      <p class="sub">Performance e principais indicadores da experiência do cliente</p>

      <div class="current-label">Relatório mais recente</div>

      <!-- MÊS ATUAL (preenchido automaticamente pelo script no final da página) -->
      <div class="cover-current" id="currentReport">
        <div class="date-badge">
          <span class="num">–</span>
          <span class="yr"></span>
        </div>
        <div class="info">
          <div class="label">Overview mensal</div>
          <div class="month">Carregando…</div>
        </div>
      </div>
    </section>

    <div class="content-inner">
      <!-- HISTÓRICO (montado automaticamente pelo script no final da página:
           anos e meses em ordem do mais recente para o mais antigo) -->
      <div class="history" id="historico">
        <div class="history-head">
          <h2>Histórico de meses anteriores</h2>
          <span class="count" id="historyCount"></span>
        </div>
        <div id="historyList"></div>
      </div>
    </div>

  </div>

  <footer>Tania Bulhões · Customer Experience</footer>

<script>
/* Monta capa + histórico automaticamente a partir dos arquivos "mes-ano.html" do repositório.
   Para publicar um mês novo basta subir o arquivo (ex: outubro-2026.html) — não precisa editar este index. */
(function(){
  var REPO_API = 'https://api.github.com/repos/tbcustomerexperience/cx-monthly-overview/contents/?ref=main';
  var CACHE_KEY = 'cx-monthly-files-v1';
  var CACHE_TTL = 5 * 60 * 1000; // 5 min
  var MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  var INDEX = { janeiro:1, fevereiro:2, marco:3, 'março':3, abril:4, maio:5, junho:6, julho:7, agosto:8, setembro:9, outubro:10, novembro:11, dezembro:12 };

  function parseFiles(names){
    var out = [];
    names.forEach(function(name){
      var m = /^([a-zç]+)-(\d{4})\.html$/i.exec(name);
      if(!m) return;
      var mes = INDEX[m[1].toLowerCase()];
      if(!mes) return;
      out.push({ name:name, mes:mes, ano:parseInt(m[2],10) });
    });
    out.sort(function(a,b){ return (b.ano - a.ano) || (b.mes - a.mes); });
    return out;
  }

  function readCache(ignoreTtl){
    try{
      var c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if(c && c.names && (ignoreTtl || Date.now() - c.t < CACHE_TTL)) return c.names;
    }catch(e){}
    return null;
  }
  function writeCache(names){
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ t:Date.now(), names:names })); }catch(e){}
  }

  function fetchNames(){
    var cached = readCache(false);
    if(cached) return Promise.resolve(cached);
    return fetch(REPO_API, { cache:'no-store' })
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(list){
        var names = list.filter(function(f){ return f.type === 'file'; }).map(function(f){ return f.name; });
        writeCache(names);
        return names;
      })
      .catch(function(err){
        var stale = readCache(true);
        if(stale) return stale;
        throw err;
      });
  }

  // Evita link quebrado: se o arquivo mais novo ainda não terminou de ser publicado, mostra o anterior.
  function dropIfNotLive(files){
    if(!files.length) return Promise.resolve(files);
    return fetch('./' + encodeURI(files[0].name), { method:'HEAD', cache:'no-store' })
      .then(function(r){ return r.ok ? files : files.slice(1); })
      .catch(function(){ return files; });
  }

  function pad(n){ return (n < 10 ? '0' : '') + n; }

  function render(files){
    var cur = document.getElementById('currentReport');
    var list = document.getElementById('historyList');
    var count = document.getElementById('historyCount');
    if(!files.length){
      cur.innerHTML = '<div class="date-badge"><span class="num">–</span></div><div class="info"><div class="label">Overview mensal</div><div class="month">Nenhum relatório publicado</div></div>';
      list.innerHTML = '';
      count.textContent = '';
      return;
    }
    var latest = files[0];
    cur.innerHTML =
      '<div class="date-badge"><span class="num">' + pad(latest.mes) + '</span><span class="yr">' + latest.ano + '</span></div>' +
      '<div class="info"><div class="label">Overview mensal</div><div class="month">' + MESES[latest.mes - 1] + ' ' + latest.ano + '</div></div>' +
      '<a href="./' + encodeURI(latest.name) + '">Abrir relatório <span>›</span></a>';

    var older = files.slice(1);
    count.textContent = older.length + (older.length === 1 ? ' relatório' : ' relatórios');
    if(!older.length){
      list.innerHTML = '<div class="history-empty">Nenhum mês arquivado ainda.</div>';
      return;
    }
    var html = '', year = null;
    older.forEach(function(f){
      if(f.ano !== year){
        if(year !== null) html += '</div></div>';
        year = f.ano;
        html += '<div class="year-group"><div class="year-label">' + f.ano + '</div><div class="history-grid">';
      }
      html += '<a class="history-card" href="./' + encodeURI(f.name) + '"><span class="month-name">' + MESES[f.mes - 1] + '</span><span class="arrow">→</span></a>';
    });
    html += '</div></div>';
    list.innerHTML = html;
  }

  fetchNames()
    .then(function(names){ return dropIfNotLive(parseFiles(names)); })
    .then(render)
    .catch(function(){
      document.querySelector('#currentReport .month').textContent = 'Não foi possível carregar os relatórios agora. Recarregue a página em instantes.';
    });
})();
</script>

</body>
</html>
